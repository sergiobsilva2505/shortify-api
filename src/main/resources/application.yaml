spring:
  application:
    name: shortify-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shortifyapiDb?useSSL=false&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # opções: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness e /readiness
      show-details: never   # sem Spring Security no projeto, não vazar detalhes
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
